# cargo-deny configuration. Run with `cargo deny check` (see SECURITY.md).
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    # Root certificates for the TLS client (webpki-roots, via ureq).
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
ignore = [
    # smartstring is unmaintained; it comes in through rhai (user scripts), which has no release without it.
    { id = "RUSTSEC-2026-0249", reason = "transitive via rhai, no maintained alternative release" },
    # ttf-parser is unmaintained; it comes in through tiny-skia and fontdb, the text and raster stack.
    { id = "RUSTSEC-2026-0192", reason = "transitive via tiny-skia/fontdb, no maintained alternative release" },
    # zvariant, zvariant_derive and zbus_names were folded into zbus 6; accesskit_unix (screen reader on Linux) still pins zbus 5.
    { id = "RUSTSEC-2026-0370", reason = "transitive via accesskit_unix, no release on zbus 6 yet" },
    { id = "RUSTSEC-2026-0371", reason = "transitive via accesskit_unix, no release on zbus 6 yet" },
    { id = "RUSTSEC-2026-0372", reason = "transitive via accesskit_unix, no release on zbus 6 yet" },
]
