[package]
name = "rustsidian"
description = "Rustsidian: a fast native Markdown knowledge base"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "rustsidian_app"
path = "src/lib.rs"

[[bin]]
name = "rustsidian"
path = "src/main.rs"

[features]
default = ["window", "wasm-plugins", "scripting"]
window = ["dep:winit", "dep:softbuffer", "dep:accesskit", "dep:accesskit_winit"]
wasm-plugins = ["dep:plugin-host-wasm"]
scripting = ["dep:scripting"]

[dependencies]
md-engine = { path = "../md-engine" }
vault-core = { path = "../vault-core" }
search-core = { path = "../search-core" }
dataview-core = { path = "../dataview-core" }
graph-core = { path = "../graph-core" }
canvas-core = { path = "../canvas-core" }
editor-core = { path = "../editor-core" }
excalidraw-core = { path = "../excalidraw-core" }
highlight-core = { path = "../highlight-core" }
math-core = { path = "../math-core" }
mermaid-core = { path = "../mermaid-core" }
theme-engine = { path = "../theme-engine" }
rustsidian-ui = { path = "../rustsidian-ui" }
ext-api = { path = "../ext-api" }
plugin-host-wasm = { path = "../plugin-host-wasm", optional = true }
scripting = { path = "../scripting", optional = true }
krilla = { version = "0.8", default-features = false, features = ["raster-images"] }
spellbook = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "3", features = ["json"] }
winit = { version = "0.30", optional = true, default-features = false, features = ["x11", "wayland", "wayland-dlopen", "rwh_06"] }
softbuffer = { version = "0.4", optional = true, default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
accesskit = { version = "0.25", optional = true }
accesskit_winit = { version = "0.34", optional = true, default-features = false, features = ["async-io", "rwh_06"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
