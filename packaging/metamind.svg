<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- MetaMind: app icon — a connected mind -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#4caf78"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#2a2a4a" stroke-width="2"/>

  <!-- Network graph: nodes and connections forming a brain-like shape -->
  <!-- Central node -->
  <circle cx="128" cy="128" r="14" fill="url(#node)"/>

  <!-- Left hemisphere nodes -->
  <circle cx="80" cy="90" r="8" fill="#7aa2f7"/>
  <circle cx="72" cy="128" r="6" fill="#7aa2f7" opacity="0.7"/>
  <circle cx="84" cy="170" r="8" fill="#7aa2f7"/>

  <!-- Right hemisphere nodes -->
  <circle cx="176" cy="90" r="8" fill="#4caf78"/>
  <circle cx="184" cy="128" r="6" fill="#4caf78" opacity="0.7"/>
  <circle cx="172" cy="170" r="8" fill="#4caf78"/>

  <!-- Top and bottom nodes -->
  <circle cx="128" cy="64" r="7" fill="#e8c268"/>
  <circle cx="128" cy="192" r="7" fill="#e8c268"/>

  <!-- Connections (edges) -->
  <g stroke="#3d5a80" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
    <line x1="128" y1="128" x2="80" y2="90"/>
    <line x1="128" y1="128" x2="72" y2="128"/>
    <line x1="128" y1="128" x2="84" y2="170"/>
    <line x1="128" y1="128" x2="176" y2="90"/>
    <line x1="128" y1="128" x2="184" y2="128"/>
    <line x1="128" y1="128" x2="172" y2="170"/>
    <line x1="128" y1="128" x2="128" y2="64"/>
    <line x1="128" y1="128" x2="128" y2="192"/>
    <line x1="80" y1="90" x2="128" y2="64"/>
    <line x1="176" y1="90" x2="128" y2="64"/>
    <line x1="84" y1="170" x2="128" y2="192"/>
    <line x1="172" y1="170" x2="128" y2="192"/>
  </g>

  <!-- Subtle inner glow -->
  <circle cx="128" cy="128" r="40" fill="none" stroke="#7aa2f7" stroke-width="1" opacity="0.15"/>
  <circle cx="128" cy="128" r="60" fill="none" stroke="#7aa2f7" stroke-width="0.5" opacity="0.08"/>
</svg>
